# Pipeline CI/CD de ReleCloud (Azure DevOps)
# 1) Stage Build_Test: instala dependencias y ejecuta los tests sobre SQLite.
# (El stage de Deploy se anadira cuando exista la conexion de servicio de Azure.)

trigger:
  branches:
    include:
      - main

variables:
  pythonVersion: '3.12'
  azureServiceConnection: 'relecloud-azure-connection'
  webAppName: 'inesplaza'

stages:
  # ---------------- BUILD + TESTS ----------------
  - stage: Build_Test
    displayName: 'Build y pruebas'
    jobs:
      - job: test
        displayName: 'Instalar dependencias y ejecutar tests'
        pool:
          name: 'Default'
        steps:
          - script: |
              python3 -m venv venv
              . venv/bin/activate
              python -m pip install --upgrade pip
              pip install -r requirements.txt
            displayName: 'Instalar dependencias'

          - script: |
              . venv/bin/activate
              python manage.py test
            displayName: 'Ejecutar tests (TDD)'
            env:
              DATABASE_URL: 'sqlite:///test.sqlite3'
              DJANGO_DEBUG: '0'

          - script: |
              . venv/bin/activate
              python manage.py collectstatic --noinput
            displayName: 'Recopilar ficheros estaticos'
            env:
              DATABASE_URL: 'sqlite:///test.sqlite3'

          - task: ArchiveFiles@2
            displayName: 'Empaquetar la aplicacion'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
              replaceExistingArchive: true

          - publish: '$(Build.ArtifactStagingDirectory)/app.zip'
            artifact: 'drop'
            displayName: 'Publicar artefacto'
